spring:
  application:
    name: eureka-service

# Eureka 注册中心配置
eureka:
  instance:
    hostname: 127.0.0.1
  client:
    # 不能注册自己
    register-with-eureka: false
    #自身 不需要去检索自己的服务
    fetch-registry: false
    #其他Eureka 客户端向本服务中心注册的地址
    service-url:
      defaultZone: http://${eureka.instance.hostname}:${server.port}/eureka/
server:
  port: 8000