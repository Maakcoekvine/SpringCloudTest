spring:
  application:
    name: eureka-service-three

server:
  port: 8003


eureka:
  instance:
    instance-id: 127.0.0.1:${server.port}
    prefer-ip-address: true

  client:
    service-url:
      defaultZone: http://127.0.0.1:8000/eureka/
    fetch-registry: true
    register-with-eureka: true